name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main, develop, insecure-app]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  TARGET_APP: "part1/app_secure.py"

jobs:
  # ─── Job 1: SAST — Bandit ──────────────────────────────────────────────────
  sast:
    name: 🔍 SAST - Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit SAST
        run: |
          bandit -r ${{ env.TARGET_APP }} \
            -f json \
            -o bandit_report.json \
            --severity-level medium \
            --exit-zero

      - name: Check for HIGH severity issues
        run: |
          HIGH=$(python -c "import json; data=json.load(open('bandit_report.json')); print(len([r for r in data['results'] if r['issue_severity']=='HIGH']))")
          echo "HIGH severity issues: $HIGH"
          if [ "$HIGH" -gt "0" ]; then
            echo "::error::SAST gate failed - $HIGH HIGH severity issues"
            exit 1
          fi
          echo "✅ SAST gate passed"

      - name: Upload SAST report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit_report.json

  # ─── Job 2: SCA — Safety ───────────────────────────────────────────────────
  dependency-check:
    name: 🔒 SCA - Safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Safety
        run: pip install "safety==2.3.5"

      - name: Run Safety
        run: |
          safety check -r requirements.txt --json --output safety_report.json || true
          echo "✅ Safety scan completed - check artifact for details"

      - name: Upload Safety report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-report
          path: safety_report.json

  # ─── Job 3: Secret Scanning — Gitleaks ─────────────────────────────────────
  secret-scan:
    name: 🔑 Secret Scanning - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.4_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks on application code only
        run: |
          mkdir -p scan-target
          cp part1/app_secure.py scan-target/
          cp requirements.txt scan-target/
          gitleaks detect \
            --source scan-target \
            --no-git \
            --report-format json \
            --report-path gitleaks_report.json \
            --exit-code 1 \
          || { echo "::error::Secret scanning found potential leaks"; exit 1; }
          echo "✅ Secret scanning passed"

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks_report.json

  # ─── Job 4: Security Unit Tests — pytest ───────────────────────────────────
  security-tests:
    name: 🧪 Security Tests - pytest
    runs-on: ubuntu-latest
    needs: [sast]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-flask

      - name: Run security tests
        run: |
          pytest part2/test_security_local.py -v --tb=short --junitxml=security_test_results.xml || echo "Some tests failed - see artifact"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-results
          path: security_test_results.xml

  # ─── Job 5: Security Gate ──────────────────────────────────────────────────
  security-gate:
    name: 🚦 Security Gate
    runs-on: ubuntu-latest
    needs: [sast, dependency-check, secret-scan, security-tests]
    if: always()
    steps:
      - name: Evaluate gates
        run: |
          echo "SAST:        ${{ needs.sast.result }}"
          echo "SCA:         ${{ needs.dependency-check.result }}"
          echo "Secrets:     ${{ needs.secret-scan.result }}"
          echo "Tests:       ${{ needs.security-tests.result }}"

          if [ "${{ needs.sast.result }}" != "success" ]; then
            echo "::error::SAST gate failed"
            exit 1
          fi
          if [ "${{ needs.secret-scan.result }}" != "success" ]; then
            echo "::error::Secret scanning gate failed"
            exit 1
          fi
          echo "✅ All security gates passed - deployment approved"
